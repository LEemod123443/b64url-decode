<h1>base64 URL auto-decoder</h1>
<p>페이지 텍스트에서 base64 / base64url로 인코딩된 URL을 찾아 클릭 가능한 링크로 바꿔주는 유저스크립트.</p>

<p><a class="btn" href="b64url.user.js">설치 (Install)</a></p>

<ol>
  <li><a href="https://violentmonkey.github.io/get-it/" target="_blank" rel="noopener">Violentmonkey</a> 또는 Tampermonkey 설치</li>
  <li>위 <b>설치</b> 버튼 클릭 → 확장 설치창이 뜨면 <b>Confirm installation</b></li>
  <li>아무 페이지나 열면 base64 URL이 자동으로 링크로 변환됨</li>
</ol>
